<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oversight Sentinel v2.0.0 | Kaseddie Labs LTD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Application Container -->
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar-nav">
            <button class="nav-toggle active" data-view="compliance">
                <span class="nav-icon">🌐</span>
                <span class="nav-label">Compliance Overwatch</span>
            </button>
            <button class="nav-toggle" data-view="b2b">
                <span class="nav-icon">💼</span>
                <span class="nav-label">B2B Partner Hub</span>
            </button>
            <button class="nav-toggle" data-view="artisan">
                <span class="nav-icon">📣</span>
                <span class="nav-label">Artisan Media Suite</span>
            </button>
            <button class="nav-toggle" data-view="admin-dashboard">
                <span class="nav-icon">📊</span>
                <span class="nav-label">Admin Dashboard</span>
            </button>
            <button class="nav-toggle" data-view="hr-portal">
                <span class="nav-icon">👤</span>
                <span class="nav-label">HR Portal</span>
            </button>
        </nav>
        <!-- Main Content Viewport -->
        <div id="main-viewport" class="main-viewport">
            <!-- Default view will be injected by app.js -->
        </div>
    </div>

    <!-- Drawer Modal for Drill-Down Details -->
    <div id="drawer" class="drawer">
        <div class="drawer-content" id="drawerContent">
            <!-- Dynamic content injected by app.js -->
        </div>
    </div>

    <!-- GlobalPath AI Assistant Chatbot Panel -->
    <div id="chatbotPanel" class="chatbot-panel">
        <div class="chatbot-header">
            <div class="chatbot-title">
                <span class="chatbot-icon">🤖</span>
                <span>GlobalPath AI Assistant</span>
            </div>
            <button class="chatbot-toggle" id="chatbotToggle">−</button>
        </div>
        <div class="chatbot-body" id="chatbotBody">
            <div class="chat-messages" id="chatMessages">
                <div class="chat-message bot">
                    <div class="message-content">Welcome to GlobalPath AI! I'm your market intelligence assistant. Ask me anything about recruitment trends, compliance regulations, or market opportunities.</div>
                </div>
            </div>
            <div class="chat-input-container">
                <textarea id="chatInput" class="chat-input" placeholder="Ask about market intelligence..." rows="2"></textarea>
                <button id="chatSendBtn" class="chat-send-btn">Send</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
